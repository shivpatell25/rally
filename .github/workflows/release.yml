name: Signed Android Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore private release key
        env:
          RALLY_KEYSTORE_BASE64: ${{ secrets.RALLY_KEYSTORE_BASE64 }}
        run: |
          test -n "$RALLY_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$RALLY_KEYSTORE_BASE64" | base64 --decode > .signing/rally-release.jks
      - name: Build signed optimized APK
        env:
          RALLY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/rally-release.jks
          RALLY_KEYSTORE_PASSWORD: ${{ secrets.RALLY_KEYSTORE_PASSWORD }}
          RALLY_KEY_ALIAS: ${{ secrets.RALLY_KEY_ALIAS }}
          RALLY_KEY_PASSWORD: ${{ secrets.RALLY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Name and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "rally-${GITHUB_REF_NAME}.apk"
          gh release upload "$GITHUB_REF_NAME" "rally-${GITHUB_REF_NAME}.apk" --clobber
