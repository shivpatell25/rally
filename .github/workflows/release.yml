name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Load publication checks from the workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # Build the tagged app, but retain current publishing checks when
          # rebuilding an older release whose source predates those checks.
          git show "$WORKFLOW_SHA:scripts/verify_android_release_assets.py" > "$RUNNER_TEMP/verify_android_release_assets.py"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
        with:
          # The old SDK `tools` package was removed from Google's repository.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install signing tools
        run: sdkmanager "build-tools;34.0.0"
      - name: Restore private signing keys
        env:
          RALLY_KEYSTORE_BASE64: ${{ secrets.RALLY_KEYSTORE_BASE64 }}
          RALLY_LEGACY_KEYSTORE_BASE64: ${{ secrets.RALLY_LEGACY_KEYSTORE_BASE64 }}
        run: |
          test -n "$RALLY_KEYSTORE_BASE64"
          test -n "$RALLY_LEGACY_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$RALLY_KEYSTORE_BASE64" | base64 --decode > .signing/rally-release.jks
          printf '%s' "$RALLY_LEGACY_KEYSTORE_BASE64" | base64 --decode > .signing/rally-legacy.jks
          chmod 600 .signing/*.jks
      - name: Build signed optimized APK
        env:
          RALLY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/rally-release.jks
          RALLY_KEYSTORE_PASSWORD: ${{ secrets.RALLY_KEYSTORE_PASSWORD }}
          RALLY_KEY_ALIAS: ${{ secrets.RALLY_KEY_ALIAS }}
          RALLY_KEY_PASSWORD: ${{ secrets.RALLY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Package and verify migration and legacy APKs
        env:
          RALLY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/rally-release.jks
          RALLY_KEYSTORE_PASSWORD: ${{ secrets.RALLY_KEYSTORE_PASSWORD }}
          RALLY_KEY_ALIAS: ${{ secrets.RALLY_KEY_ALIAS }}
          RALLY_KEY_PASSWORD: ${{ secrets.RALLY_KEY_PASSWORD }}
          RALLY_LEGACY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/rally-legacy.jks
          RALLY_LEGACY_KEYSTORE_PASSWORD: ${{ secrets.RALLY_LEGACY_KEYSTORE_PASSWORD }}
          RALLY_LEGACY_KEY_ALIAS: ${{ secrets.RALLY_LEGACY_KEY_ALIAS }}
          RALLY_LEGACY_KEY_PASSWORD: ${{ secrets.RALLY_LEGACY_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/sign_android_release.py --migration --output "rally-${RELEASE_TAG}-android-tv.apk"
          python3 scripts/sign_android_release.py --output "rally-${RELEASE_TAG}-android-tv-legacy.apk"
          # Beta 10/11 selects the first .apk on a version tie. GitHub sorts
          # assets by name, putting the legacy APK before the tagged migration.
          # Keep a compatible, earlier-sorting download for those installed apps.
          cp "rally-${RELEASE_TAG}-android-tv.apk" rally-android-tv.apk
          sha256sum rally-android-tv.apk "rally-${RELEASE_TAG}-android-tv.apk" "rally-${RELEASE_TAG}-android-tv-legacy.apk" > SHA256SUMS
      - name: Publish verified APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" rally-android-tv.apk "rally-${RELEASE_TAG}-android-tv.apk" "rally-${RELEASE_TAG}-android-tv-legacy.apk" SHA256SUMS --clobber
          python3 "$RUNNER_TEMP/verify_android_release_assets.py" --tag "$RELEASE_TAG"
      - name: Remove private keys
        if: always()
        run: rm -f .signing/rally-release.jks .signing/rally-legacy.jks
