name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore private release key
        env:
          RALLY_KEYSTORE_BASE64: ${{ secrets.RALLY_KEYSTORE_BASE64 }}
        run: |
          test -n "$RALLY_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$RALLY_KEYSTORE_BASE64" | base64 --decode > .signing/rally-release.jks
      - name: Build signed optimized APK
        env:
          RALLY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/rally-release.jks
          RALLY_KEYSTORE_PASSWORD: ${{ secrets.RALLY_KEYSTORE_PASSWORD }}
          RALLY_KEY_ALIAS: ${{ secrets.RALLY_KEY_ALIAS }}
          RALLY_KEY_PASSWORD: ${{ secrets.RALLY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Name and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "rally-${RELEASE_TAG}.apk"
          gh release upload "$RELEASE_TAG" "rally-${RELEASE_TAG}.apk" --clobber
