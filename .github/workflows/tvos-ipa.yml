name: Build Apple TV IPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"
      - name: Build unsigned Apple TV app
        env:
          DERIVED_DATA: ${{ runner.temp }}/rally-derived
        run: |
          xcodebuild \
            -project apple/RallyTV/RallyTV.xcodeproj \
            -scheme RallyTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package and validate unsigned IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/rally-derived
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release-appletvos/RallyTV.app"
          test -d "$APP"
          PACKAGE="$RUNNER_TEMP/rally-ipa-package"
          mkdir -p "$PACKAGE/Payload"
          ditto "$APP" "$PACKAGE/Payload/RallyTV.app"
          IPA="$RUNNER_TEMP/RallyTV-${RELEASE_TAG}-tvOS-unsigned.ipa"
          (cd "$PACKAGE" && /usr/bin/zip -qry -X -y "$IPA" Payload)
          unzip -t "$IPA"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.shiv.rally.tv'
          shasum -a 256 "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber
